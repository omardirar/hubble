app = "hubble-agent-backend"
primary_region = "ord"       # Chicago (or choose closest to your users)

[build]

[env]
ANTHROPIC_API_KEY = "your_key"
MCP_SERVER_URL = "https://hubble-mcp-gateway.fly.dev/motherduck"
DASHBOARD_URL = "https://your-dashboard.vercel.app"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/health"

[machines]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
