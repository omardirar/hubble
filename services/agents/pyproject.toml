[project]
name = "hubble-agents"
version = "1.0.0"
description = "Hubble AI Agents Service"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai>=1.0.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.0.0",
  "fastapi>=0.114.1",
  "uvicorn[standard]>=0.37.0",
  "httpx[http2]>=0.28.0",
  "sse-starlette>=1.6.0",
  "python-multipart>=0.0.6",
  "zstandard>=0.22.0",
  "mcp>=1.17.0",
  "pyjwt[crypto]>=2.8.0",
  "cryptography>=41.0.0",
  "supabase>=2.0.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.14.0",
  "mypy>=1.10.0",
  "types-requests>=2.32.0",
]

[project.scripts]
hubble-agents = "hubble_agents.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubble_agents"]
