[project]
name = "hubble-agents"
version = "1.0.0"
description = "Hubble AI Agents Service"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12.0",
  "pydantic-settings>=2.0.0",
  "fastapi>=0.114.1",
  "uvicorn[standard]>=0.37.0",
  "click>=8.1.7",
  "pyjwt[crypto]>=2.8.0",
  "crewai>=0.203.0",
  "pyyaml>=6.0.2",
  "asyncpg>=0.29.0",
  "sse-starlette>=1.6.5",
  "opentelemetry-sdk>=1.37.0",
  "opentelemetry-exporter-otlp-proto-http>=1.37.0",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-instrumentation-httpx>=0.47b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.14.0",
  "mypy>=1.10.0",
  "types-requests>=2.32.0",
  "types-jsonschema>=4.17.0",
  "jsonschema>=4.17.0",
]

[project.scripts]
cli = "hubble_agents.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hubble_agents"]

[dependency-groups]
dev = ["jsonschema>=4.25.1"]
