[project]
name = "h10s"
version = "1.0.0"
description = "H10S Marketing Copilot - Multi-Specialist Agent System"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12.0",
  "pydantic-settings>=2.0.0",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.30",
  "langchain-anthropic>=0.2.10",
  "langgraph-cli[inmem]>=0.4.4",
  "langchain-mcp-adapters>=0.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.14.0",
  "mypy>=1.10.0",
  "langgraph-cli[inmem]>=0.2.60",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h10s"]
