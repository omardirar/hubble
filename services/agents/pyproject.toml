[project]
name = "hubble-agents"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-ai>=1.0.0",
  "pydantic>=2.12.0",
  "fastapi>=0.114.1",
  "uvicorn[standard]>=0.37.0",
  "httpx[http2]>=0.28.0",
  "sse-starlette>=1.6.0",
  "python-multipart>=0.0.6",
  "zstandard>=0.22.0",
  "mcp>=1.17.0",
]

# Development dependencies managed at workspace level

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
cli = "src.cli:main"
