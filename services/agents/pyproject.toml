[project]
name = "hubble-agents"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-ai>=1.0.0",
  "pydantic>=2.12.0",
  "fastapi>=0.114.1",
  "uvicorn[standard]>=0.37.0",
  "httpx[http2]>=0.28.0",
  "sse-starlette>=1.6.0",
  "python-multipart>=0.0.6",
  "zstandard>=0.22.0",
  "mcp>=1.17.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

# Only include the real package under src/
[tool.hatch.build.targets.wheel]
packages = ["src/hubble_agents"]

# If you expose a CLI, point it at the package path (not src.*)
[project.scripts]
cli = "hubble_agents.cli:main"
