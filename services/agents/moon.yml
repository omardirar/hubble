$schema: "https://moonrepo.dev/schemas/project.json"

id: "agents"
language: "python"
layer: "application"
stack: "backend"

tags:
  - "agents"
  - "python"

fileGroups:
  sources:
    - "src/**/*.py"
    - "*.py"
  docker:
    - "Dockerfile"
    - "pyproject.toml"
    - "src/**"
  env:
    - ".env.local"

tasks:
  # Build a local image you can run immediately
  build:
    command: "bash"
    args:
      - "-lc"
      - "docker compose build agents-api"
    inputs:
      - "@group(docker)"
    options:
      cache: true
      runInCI: true
      runFromWorkspaceRoot: true

  # One-shot dev: build + run the container with env file
  dev:
    command: "bash"
    args:
      - "-c"
      - "docker compose up agents-api --build"
    inputs:
      - "@group(docker)"
      - "@group(env)"
    options:
      runFromWorkspaceRoot: true
    local: true

  # Local hot-reload without Docker (uses your interpreter)
  api-dev:
    command: "bash"
    args:
      - "-c"
      - "uv run --project . uvicorn h10s.api.main:app --reload --host 0.0.0.0 --port 8000 --env-file .env.local"
    inputs:
      - "@group(sources)"
    options:
      cache: false
      persistent: true
      runInCI: false
    local: true

  # Testing tasks
  test:
    command: "pytest"
    args:
      - "-v"
      - "tests/"
    inputs:
      - "@group(sources)"
      - "tests/**/*.py"
      - "pyproject.toml"
    options:
      cache: false
      runInCI: true

  test-unit:
    command: "pytest"
    args:
      - "-v"
      - "tests/unit/"
    inputs:
      - "@group(sources)"
      - "tests/unit/**/*.py"
    options:
      cache: false

  test-integration:
    command: "pytest"
    args:
      - "-v"
      - "tests/integration/"
    inputs:
      - "@group(sources)"
      - "tests/integration/**/*.py"
    options:
      cache: false
      runInCI: true

  test-cov:
    command: "pytest"
    args:
      - "--cov=src"
      - "--cov-report=html"
      - "--cov-report=term"
      - "tests/"
    inputs:
      - "@group(sources)"
      - "tests/**/*.py"
    options:
      cache: false
