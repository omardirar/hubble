$schema: "https://moonrepo.dev/schemas/project.json"

id: "agents"
language: "python"
layer: "application"
stack: "backend"

tags:
  - "agents"
  - "python"

toolchain:
  python:
    version: "3.12.11"

fileGroups:
  sources:
    - "src/**/*.py"
    - "*.py"
  docker:
    - "Dockerfile"
    - "pyproject.toml"
    - "src/**"
  env:
    - ".env.local"

tasks:
  # Build a local image you can run immediately (uses buildx + --load)
  build:
    command: "docker"
    args:
      - "buildx"
      - "build"
      - "--load"
      - "-t"
      - "hubble-agents:latest"
      - "-f"
      - "Dockerfile"
      - "."
    inputs:
      - "@group(docker)"
    options:
      cache: true
      runInCI: true

  # One-shot dev: build + run the container with env file
  dev:
    command: "bash"
    args:
      - "-c"
      - "
        docker buildx build --load
        -t hubble-agents:latest
        -f Dockerfile .
        &&
        docker run --rm
        -p 8000:8000
        --name hubble-agents
        --env-file .env.local
        hubble-agents:latest"
    inputs:
      - "@group(docker)"
      - "@group(env)"
    options:
      cache: false
      persistent: false
      runInCI: false
    local: true

  # Local hot-reload without Docker (uses your interpreter)
  api-dev:
    command: "uvicorn"
    args:
      - "hubble_agents.main:app"
      - "--reload"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    inputs:
      - "@group(sources)"
    options:
      cache: false
      persistent: true
      runInCI: false
    local: true

  # Run the CLI entrypoint with your local Python (not in Docker)
  cli:
    command: "bash"
    args:
      - "-lc"
      - "uv run cli"
    inputs:
      - "@group(sources)"
      - "pyproject.toml"
    options:
      cache: false
      runInCI: false
      interactive: true
      runFromWorkspaceRoot: false
    local: true
