# Growth Copilot task configurations

growth_plan:
  description: >
    Analyse the provided marketing context and craft a structured campaign plan.
    Include channel recommendations, budget allocation, timelines, and clear KPIs.

    User prompt: {user_prompt}
  expected_output: >
    Markdown report containing executive summary, detailed allocations,
    and follow-up actions.
  agent: specialist
  async_execution: false
