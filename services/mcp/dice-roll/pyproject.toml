[project]
name = "hubble-mcp-dice-roll"
version = "1.0.0"
description = "Simple dice roll MCP server for testing"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.17.0",
  "starlette>=0.48.0",
  "uvicorn[standard]>=0.37.0",
  "anyio>=4.4.0",
]

# Development dependencies managed at workspace level

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dice_roll"]
