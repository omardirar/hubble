$schema: "https://moonrepo.dev/schemas/project.json"

id: "mcp"
language: "unknown"
layer: "configuration"
stack: "infrastructure"

tags:
  - "mcp"
  - "docker"
  - "caddy"

dependsOn:
  - "motherduck"
  - "dice-roll"

fileGroups:
  configs:
    - "Dockerfile"
    - "Caddyfile"
    - "start.sh"
  sources:
    - "motherduck/src/**/*"

tasks:
  build:
    command: "docker"
    args:
      - "buildx"
      - "build"
      - "-t"
      - "hubble-mcp"
      - "-f"
      - "Dockerfile"
      - "."
    description: "Build MCP Docker image"
    inputs:
      - "Dockerfile"
      - "Caddyfile"
      - "start.sh"
      - "pyproject.toml"
      - "motherduck/src/**/*"
      - "motherduck/pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      cache: false
      runInCI: true
      mergeArgs: "replace"
      mergeDeps: "replace"

  dev:
    command: "bash"
    args:
      - "-c"
      - "
        docker buildx build --load
        -t hubble-mcp:latest
        -f Dockerfile .
        && docker run --rm
        -p 8080:8080
        --name hubble-mcp
        hubble-mcp:latest"
    description: "Build and run MCP gateway locally"
