$schema: "https://moonrepo.dev/schemas/project.json"

id: "mcp"
language: "unknown"
layer: "configuration"
stack: "infrastructure"

tags:
  - "mcp"
  - "docker"
  - "caddy"

dependsOn:
  - "motherduck"
  - "dice-roll"

fileGroups:
  configs:
    - "Dockerfile"
    - "Caddyfile"
    - "start.sh"
  sources:
    - "motherduck/src/**/*"

tasks:
  build:
    command: "bash"
    args:
      - "-lc"
      - "docker compose build mcp"
    description: "Build MCP Docker image"
    inputs:
      - "Dockerfile"
      - "Caddyfile"
      - "start.sh"
      - "pyproject.toml"
      - "motherduck/src/**/*"
      - "motherduck/pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    options:
      cache: false
      runInCI: true
      mergeArgs: "replace"
      mergeDeps: "replace"
      runFromWorkspaceRoot: true

  dev:
    command: "bash"
    args:
      - "-c"
      - "docker compose up mcp --build"
    description: "Build and run MCP gateway locally"
    options:
      runFromWorkspaceRoot: true
    local: true
