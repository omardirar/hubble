[project]
name = "hubble-mcp-motherduck"
version = "1.0.0"
description = "Hubble MCP server for MotherDuck"
requires-python = ">=3.12"
dependencies = [
  "duckdb==1.3.1",
  "tabulate>=0.9.0",
  "click>=8.1.8",
  "starlette>=0.46.1",
  "uvicorn[standard]>=0.37.0",
  "anyio>=4.4.0",
  "mcp>=1.17.0",
  "pytz>=2024.1",
  "sqlparse>=0.5.0",
  "pyarrow>=21.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.14.0",
  "mypy>=1.10.0",
  "types-tabulate>=0.9.0",
  "types-pytz>=2024.2.0",
]

[project.scripts]
mcp-server-motherduck = "motherduck:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motherduck"]
