[project]
name = "hubble-mcp-motherduck"
version = "1.0.0"
description = "Hubble MCP server for MotherDuck"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==1.3.1",
  "tabulate>=0.9.0",
  "click>=8.1.8",
  "starlette>=0.46.1",
  "uvicorn[standard]>=0.37.0",
  "anyio>=4.4.0",
  "mcp>=1.17.0",
  "pytz>=2024.1",
  "sqlparse>=0.5.0",
  "pyarrow>=21.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motherduck"]

# Development dependencies managed at workspace level

[project.scripts]
mcp-server-motherduck = "motherduck:main"
