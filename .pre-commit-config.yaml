default_language_version:
  python: python3
exclude: "^(node_modules/|\\.next/|\\.open-next/|dist/|build/|coverage/)"
minimum_pre_commit_version: 3.7.0
repos:
  - hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - args:
          - --maxkb=500
        id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - exclude: ^src/lib/jwt\.ts$
        id: detect-private-key
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
  - hooks:
      - args:
          - -L
          - crate
          - --ignore-words-list
          - afterAll,beforeAll
        exclude: (?:^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$
        id: codespell
    repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
  - hooks:
      - id: actionlint
    repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
  - hooks:
      - args:
          - -d
          - >-
            {extends: default,
            rules: {line-length: {max: 120},
            document-start: disable,
            truthy: disable,
            braces: disable,
            comments: {min-spaces-from-content: 1}}}
        id: yamllint
        exclude: ^pnpm-lock\.yaml$
    repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - hooks:
      - files: \.(md|mdx)$
        id: markdownlint
        exclude: ^\.turbo/
    repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
  - hooks:
      - id: shellcheck
    repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
  - hooks:
      - args:
          - -i
          - "2"
          - -ci
        id: shfmt
    repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
  - hooks:
      - args:
          - --builtin-schema
          - github-workflows
        files: .github/workflows/.*\.ya?ml$
        id: check-jsonschema
        name: Check GitHub Actions workflows
      - args:
          - --schemafile
          - https://json.schemastore.org/dependabot-2.0.json
        files: \.github/dependabot\.ya?ml$
        id: check-jsonschema
        name: Check Dependabot config
    repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.3
  - hooks:
      - id: editorconfig-checker
        exclude: ^\.turbo/|^infra/supabase/supabase/migrations/|^apps/web/README\.md$|Caddyfile$
    repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.4.0
  # Dockerfile linting
  - hooks:
      - id: hadolint
        args: [--ignore, DL3008, --ignore, DL3015]
    repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
  # TOML linting and formatting
  - hooks:
      - id: taplo-lint
        name: Lint TOML files
        entry: taplo lint
        language: system
        files: \.toml$
        pass_filenames: true
      - id: taplo-format
        name: Format TOML files
        entry: taplo format
        language: system
        files: \.toml$
        pass_filenames: true
    repo: local
  # Caddyfile validation and formatting
  - hooks:
      - id: caddy-validate
        name: Validate Caddyfile
        entry: caddy validate --config
        language: system
        files: ^.*Caddyfile$
        pass_filenames: true
      - id: caddy-fmt
        name: Format Caddyfile
        entry: caddy fmt --overwrite
        language: system
        files: ^.*Caddyfile$
        pass_filenames: true
    repo: local
  # Prettier formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, scss]
  # ESLint
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        args: [--fix]
        types_or: [javascript, jsx, ts, tsx]
        additional_dependencies:
          - eslint@^9.35.0
          - typescript@^5.9.2
  # TypeScript type checking
  - hooks:
      - id: tsc
        name: TypeScript type-check
        entry: pnpm exec tsc --noEmit
        language: system
        types: [ts, tsx]
        pass_filenames: false
    repo: local
  # Python mypy type checking
  - hooks:
      - id: mypy
        name: Type-check Python with mypy
        entry: uv run mypy services/
        language: system
        types: [python]
        pass_filenames: false
    repo: local
