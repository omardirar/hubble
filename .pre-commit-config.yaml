default_language_version:
  python: python3
exclude: "^(\n  node_modules/|\n  \\.next/|\n  \\.open-next/|\n  dist/|\n  build/|\n\
  \  coverage/\n)\n"
minimum_pre_commit_version: 3.7.0
repos:
  - hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - args:
          - --maxkb=500
        id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-case-conflict
      - exclude: ^src/lib/jwt\.ts$
        id: detect-private-key
    repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
  - hooks:
      - args:
          - -L
          - crate
          - --ignore-words-list
          - afterAll,beforeAll
        exclude: (?:^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$
        id: codespell
    repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
  - hooks:
      - id: actionlint
    repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
  - hooks:
      - args:
          - -d
          - "{extends: default, rules: {line-length: {max: 120}}}"
        id: yamllint
        exclude: ^pnpm-lock\.yaml$
    repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      - id: ruff
        stages:
          - pre-commit
  - hooks:
      - files: \.(md|mdx)$
        id: markdownlint
        exclude: ^\.turbo/
    repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
  - hooks:
      - id: shellcheck
    repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
  - hooks:
      - args:
          - -i
          - "2"
          - -ci
        id: shfmt
    repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.12.0-2
  - hooks:
      - args:
          - --builtin-schema
          - github-workflows
        files: .github/workflows/.*\.ya?ml$
        id: check-jsonschema
        name: Check GitHub Actions workflows
      - args:
          - --schemafile
          - https://json.schemastore.org/dependabot-2.0.json
        files: \.github/dependabot\.ya?ml$
        id: check-jsonschema
        name: Check Dependabot config
    repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.33.3
  - hooks:
      - id: editorconfig-checker
        exclude: ^\.turbo/|^infra/supabase/supabase/migrations/|^apps/web/README\.md$
    repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3.4.0
  - hooks:
      - additional_dependencies:
          - cz-conventional-gitmoji
        id: commitizen
        stages:
          - commit-msg
    repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.4
  - hooks:
      - additional_dependencies: []
        entry: npx --yes prettier --write
        id: prettier
        language: system
        name: Prettier
        exclude: ^(\.turbo/|pnpm-lock\.yaml$)
        types_or:
          - javascript
          - jsx
          - ts
          - tsx
          - json
          - css
          - scss
          - markdown
          - yaml
      - entry: pnpm --filter @hubble/mcp-servers lint
        id: mcp-servers-lint
        language: system
        name: MCP servers lint (Prettier check)
        pass_filenames: false
      - entry: npx --yes turbo run lint --filter=...[HEAD] --cache-dir=.turbo
        id: turbo-lint
        language: system
        name: ESLint via Turbo (affected)
        pass_filenames: false
      - entry: npx --yes turbo run typecheck --filter=...[HEAD] --cache-dir=.turbo
        id: turbo-typecheck
        language: system
        name: TypeScript type-check via Turbo (affected)
        pass_filenames: false
    repo: local
