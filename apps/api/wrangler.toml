name = "hubble-api"
main = "./dist/index.mjs"
compatibility_date = "2025-09-05"
compatibility_flags = ["nodejs_compat"]

[build]
command = "pnpm build"

[observability.logs]
enabled = true

# Logging configuration with environment-specific settings
# Sampling: 100% for preview (debug), 10% for production (info)
# Retention: 7 days preview, 30 days production
# Sinks: Workers Analytics enabled, Logpush configured via dashboard

[env.preview]
# Preview environment: hubble-api-preview.workers.dev
workers_dev = true

[env.preview.vars]
ENVIRONMENT = "preview"
API_BASE_URL = "https://hubble-api-preview.github-cc7.workers.dev"
LOG_LEVEL = "debug"
CACHE_TTL = "300"

# Secrets Store bindings for preview environment
[[env.preview.secrets_store_secrets]]
binding = "CLERK_SECRET_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "CLERK_SECRET_KEY"

[[env.preview.secrets_store_secrets]]
binding = "ANTHROPIC_API_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "ANTHROPIC_API_KEY"

[[env.preview.secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_URL"

[[env.preview.secrets_store_secrets]]
binding = "SUPABASE_ANON_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_ANON_KEY"

[[env.preview.secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

# Preview-specific bindings for development and testing
[[env.preview.kv_namespaces]]
binding = "CACHE_KV"
id = "79c4caa17963435b839082441f1fdb98"
preview_id = "79c4caa17963435b839082441f1fdb98"

[[env.preview.kv_namespaces]]
binding = "SESSION_KV"
id = "90eb7c6ecf92413ca71d6947c75e3adc"
preview_id = "90eb7c6ecf92413ca71d6947c75e3adc"

[[env.preview.d1_databases]]
binding = "WORKFLOW_DB"
database_name = "hubble-workflows-preview"
database_id = "41dfe410-1992-4f3e-9289-1bafd1d32adf"

# Queue configuration will be added when needed
# Note: Queue syntax varies by wrangler version - configure when implementing workflow features

[[env.preview.r2_buckets]]
binding = "TEMP_STORAGE"
bucket_name = "hubble-temp-preview"

[env.production]
# Production environment: hubble-api.workers.dev
# Zero-downtime deployment: Uses gradual traffic shifting and health checks
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://hubble-api.github-cc7.workers.dev"
LOG_LEVEL = "info"
CACHE_TTL = "3600"

# Secrets Store bindings for production environment
[[env.production.secrets_store_secrets]]
binding = "CLERK_SECRET_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "CLERK_SECRET_KEY"

[[env.production.secrets_store_secrets]]
binding = "ANTHROPIC_API_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "ANTHROPIC_API_KEY"

[[env.production.secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_URL"

[[env.production.secrets_store_secrets]]
binding = "SUPABASE_ANON_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_ANON_KEY"

[[env.production.secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

# Production bindings with high availability and monitoring
[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "7e135cb1c36b43a1983db2ccc3c75944"

[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "9c5bd7b69de74ad3a8e438130759c135"

[[env.production.d1_databases]]
binding = "WORKFLOW_DB"
database_name = "hubble-workflows-production"
database_id = "ed66b90a-fc8e-4684-ae72-29b61baf4e30"

# Queue configuration will be added when needed
# Note: Queue syntax varies by wrangler version - configure when implementing workflow features

[[env.production.r2_buckets]]
binding = "TEMP_STORAGE"
bucket_name = "hubble-temp-production"

# Global bindings configuration complete
# All environment-specific bindings are configured above in [env.preview] and [env.production]
#
# Required Cloudflare Resources Setup:
# 1. KV Namespaces: Create CACHE_KV and SESSION_KV for both environments
# 2. D1 Databases: Create WORKFLOW_DB databases for preview/production
# 3. Queues: Create PROVISIONING_QUEUE for both environments
# 4. R2 Buckets: Create TEMP_STORAGE buckets for both environments
#
# To create these resources:
# - Run: wrangler kv:namespace create CACHE_KV --preview
# - Run: wrangler d1 create hubble-workflows-preview
# - Run: wrangler queues create provisioning-queue-preview
# - Run: wrangler r2 bucket create hubble-temp-preview
