# Hubble API Worker Configuration
#
# This Cloudflare Worker serves as the centralized backend API for the Hubble application.
# It handles all server-side operations including database access, AI chat, connection
# management, and other business logic.
#
# Architecture:
# - Centralized API worker for all backend operations
# - Uses Cloudflare Secrets Store for secure secret management
# - Implements proxy pattern: Web app → API worker → Supabase
# - All sensitive operations are handled server-side
# - Supports both traditional and Cloudflare-specific bindings

# Worker identification and entry point
name = "hubble-api"                    # Worker name (used in *.workers.dev URL)
main = "./dist/index.mjs"             # Entry point file (compiled from TypeScript)
compatibility_date = "2025-09-05"     # Cloudflare Workers compatibility date
compatibility_flags = ["nodejs_compat"] # Enable Node.js compatibility for dependencies

# Build configuration
[build]
command = "pnpm build"                # Command to build the worker

# Observability and logging
[observability.logs]
enabled = true                        # Enable structured logging

# Logging configuration with environment-specific settings
# Sampling: 100% for preview (debug), 10% for production (info)
# Retention: 7 days preview, 30 days production
# Sinks: Workers Analytics enabled, Logpush configured via dashboard

# Local Development Environment Configuration
# Used when running `wrangler dev` locally
[env.local]
workers_dev = false                     # Don't use workers.dev for local development

# Environment variables for local development (using regular env vars instead of Secrets Store)
[env.local.vars]
ENVIRONMENT = "local"                   # Environment identifier
API_BASE_URL = "http://localhost:8787" # Local API base URL
LOG_LEVEL = "debug"                    # Detailed logging for development
CACHE_TTL = "300"                      # Cache TTL in seconds (5 minutes)
# These will be overridden by values from .env.local file
SUPABASE_URL = "placeholder"           # Will be replaced by .env.local
SUPABASE_ANON_KEY = "placeholder"      # Will be replaced by .env.local
SUPABASE_SERVICE_ROLE_KEY = "placeholder" # Will be replaced by .env.local
CLERK_SECRET_KEY = "placeholder"       # Will be replaced by .env.local
ANTHROPIC_API_KEY = "placeholder"      # Will be replaced by .env.local

# Local development uses regular environment variables instead of Secrets Store
# These should be set in your local .env.local file or shell environment
# Required variables:
# - SUPABASE_URL
# - SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - CLERK_SECRET_KEY
# - ANTHROPIC_API_KEY

# Preview Environment Configuration
# Deployed to: hubble-api-preview.github-cc7.workers.dev
[env.preview]
workers_dev = true                     # Use workers.dev subdomain for preview

# Environment variables for preview (public configuration)
[env.preview.vars]
ENVIRONMENT = "preview"                # Environment identifier
API_BASE_URL = "https://hubble-api-preview.github-cc7.workers.dev"  # API base URL
LOG_LEVEL = "debug"                   # Detailed logging for development
CACHE_TTL = "300"                     # Cache TTL in seconds (5 minutes)

# Secrets Store bindings for preview environment
# All sensitive data is stored in Cloudflare Secrets Store for security
[[env.preview.secrets_store_secrets]]
binding = "CLERK_SECRET_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "CLERK_SECRET_KEY"

[[env.preview.secrets_store_secrets]]
binding = "ANTHROPIC_API_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "ANTHROPIC_API_KEY"

[[env.preview.secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_URL"

[[env.preview.secrets_store_secrets]]
binding = "SUPABASE_ANON_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_ANON_KEY"

[[env.preview.secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

# Preview-specific bindings for development and testing
[[env.preview.kv_namespaces]]
binding = "CACHE_KV"
id = "79c4caa17963435b839082441f1fdb98"
preview_id = "79c4caa17963435b839082441f1fdb98"

[[env.preview.kv_namespaces]]
binding = "SESSION_KV"
id = "90eb7c6ecf92413ca71d6947c75e3adc"
preview_id = "90eb7c6ecf92413ca71d6947c75e3adc"

[[env.preview.d1_databases]]
binding = "WORKFLOW_DB"
database_name = "hubble-workflows-preview"
database_id = "41dfe410-1992-4f3e-9289-1bafd1d32adf"

# Queue configuration will be added when needed
# Note: Queue syntax varies by wrangler version - configure when implementing workflow features

[[env.preview.r2_buckets]]
binding = "TEMP_STORAGE"
bucket_name = "hubble-temp-preview"

[env.production]
# Production environment: hubble-api.workers.dev
# Zero-downtime deployment: Uses gradual traffic shifting and health checks
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://hubble-api.github-cc7.workers.dev"
LOG_LEVEL = "info"
CACHE_TTL = "3600"

# Secrets Store bindings for production environment
[[env.production.secrets_store_secrets]]
binding = "CLERK_SECRET_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "CLERK_SECRET_KEY"

[[env.production.secrets_store_secrets]]
binding = "ANTHROPIC_API_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "ANTHROPIC_API_KEY"

[[env.production.secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_URL"

[[env.production.secrets_store_secrets]]
binding = "SUPABASE_ANON_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_ANON_KEY"

[[env.production.secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "f37d78acf99641778b64ea4c0761c543"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

# Production bindings with high availability and monitoring
[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "7e135cb1c36b43a1983db2ccc3c75944"

[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "9c5bd7b69de74ad3a8e438130759c135"

[[env.production.d1_databases]]
binding = "WORKFLOW_DB"
database_name = "hubble-workflows-production"
database_id = "ed66b90a-fc8e-4684-ae72-29b61baf4e30"

# Queue configuration will be added when needed
# Note: Queue syntax varies by wrangler version - configure when implementing workflow features

[[env.production.r2_buckets]]
binding = "TEMP_STORAGE"
bucket_name = "hubble-temp-production"

# Global bindings configuration complete
# All environment-specific bindings are configured above in [env.preview] and [env.production]
#
# Required Cloudflare Resources Setup:
# 1. KV Namespaces: Create CACHE_KV and SESSION_KV for both environments
# 2. D1 Databases: Create WORKFLOW_DB databases for preview/production
# 3. Queues: Create PROVISIONING_QUEUE for both environments
# 4. R2 Buckets: Create TEMP_STORAGE buckets for both environments
#
# To create these resources:
# - Run: wrangler kv:namespace create CACHE_KV --preview
# - Run: wrangler d1 create hubble-workflows-preview
# - Run: wrangler queues create provisioning-queue-preview
# - Run: wrangler r2 bucket create hubble-temp-preview
