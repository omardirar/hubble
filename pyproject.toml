# Root workspace coordinator - NOT a package
# Manages Python workspace members and shared tooling configuration

[tool.uv.workspace]
members = [
  "services/agents",
  "services/mcp/motherduck",
  "services/mcp/dice-roll",
]

[tool.uv]
python-preference = "managed"
python-downloads = "automatic"

[dependency-groups]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.14.0",
  "mypy>=1.10.0",
  "pyright>=1.1.379",
  "types-requests>=2.32.0.20241016",
  "types-tabulate>=0.9.0",
  "types-pytz>=2024.2.0",
  "types-jsonschema>=4.17.0",
  "jsonschema>=4.17.0",
  "types-pyyaml>=6.0.12.20250915",
  "pyjwt[crypto]>=2.10.1",
]

# ============================================================================
# Shared Tooling Configuration (applies to all workspace members)
# ============================================================================

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["services/*/src", "services/*/*/src"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["h10s", "motherduck"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = false
show_error_codes = true
# Exclude root-level scripts and utilities
exclude = ["^generate_token\\.py$", "^scripts/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ty.src]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  ".git",
  "**/.pytest_cache",
  "**/.next",
  "**/dist",
  "**/build",
  "**/.turbo",
  "**/.venv",
  "**/typings",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow running tests",
]

[tool.coverage.run]
source = ["services"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]
