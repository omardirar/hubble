# Workspace configuration for unified Python development
# This file configures UV to use a single .venv at the repository root
# for all Python projects in the workspace

[project]
name = "hubble-workspace"
version = "1.0.0"
description = "Hubble development workspace with unified virtual environment"
requires-python = ">=3.12,<3.13"
dependencies = ["hubble-mcp-motherduck", "hubble-agents"]

[project.scripts]
mcp-server-motherduck = "motherduck:main"
cli = "src.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
include = ["pyproject.toml"]

[tool.uv.workspace]
members = [
  "services/agents",
  "services/mcp/motherduck",
  "services/mcp/dice-roll",
]

[tool.uv]
# Ensure UV uses managed Python installations
python-preference = "managed"
# Automatically download Python if needed
python-downloads = "automatic"
# Ensure consistency across all workspace members
fork-strategy = "requires-python"

[dependency-groups]
# Core shared dependencies used across multiple workspace members
shared = [
  "mcp>=1.17.0",
  "pydantic>=2.12.0",
  "starlette>=0.48.0",
  "uvicorn[standard]>=0.37.0",
  "anyio>=4.4.0",
]

# Agent-specific dependencies
agents = [
  "pydantic-ai>=1.0.0",
  "pydantic-settings>=2.11.0",
  "fastapi>=0.118.0",
  "httpx[http2]>=0.28.0",
  "sse-starlette>=1.6.0",
  "python-multipart>=0.0.6",
  "zstandard>=0.22.0",
]

# Data processing dependencies for MotherDuck MCP
data = [
  "duckdb>=1.3.1",
  "pyarrow>=21.0.0",
  "tabulate>=0.9.0",
  "pytz>=2024.1",
  "sqlparse>=0.5.0",
]

dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.12.0",
  "pytest-xdist>=3.5.0",
  "ruff>=0.14.0",
  "mypy>=1.10.0",
  "pyright>=1.1.379",
  "no-implicit-optional>=1.4",
  "safety>=2.3.0",
  "bandit>=1.7.0",
  # Type stubs for dependencies used in workspace
  "types-requests==2.32.0.20241016",
  "types-pyyaml==6.0.12.20241230",
  "types-setuptools==75.6.0.20241223",
  "types-tabulate>=0.9.0",
  "types-pytz>=2024.2.0",
  "types-click>=7.1.0",
  "hubble-mcp-motherduck",
]

[tool.uv.pip]
# Use the workspace-wide Python version requirement for pip operations
python-version = "3.12"

[tool.uv.sources]
hubble-agents = { workspace = true }
hubble-mcp-motherduck = { workspace = true }

[tool.ruff]
target-version = "py312"
src = ["services/*/src", "services/*/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = false
namespace_packages = true
show_error_codes = true
# Handle monorepo structure for workspace
explicit_package_bases = true
# Exclude workspace-level __init__.py files that cause duplicate module errors
exclude = [
  "^services/__init__.py$",
  "^services/agents/__init__.py$",
  "^services/agents/pyproject.toml$",
  "^services/mcp/*/pyproject.toml$",
  "^pyproject.toml$",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "pyarrow"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow running tests",
]

[tool.coverage.run]
source = ["services"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
]

# Bandit security linting configuration
[tool.bandit]
exclude_dirs = ["tests", "test_*"]
skips = [
  "B101",
  "B601",
] # Skip assert checks and shell calls in trusted contexts

# Safety vulnerability checking
[tool.safety]
ignore = [] # Add vulnerability IDs to ignore if needed
