$schema: "https://moonrepo.dev/schemas/tasks.json"

taskOptions:
  cache: true
  runInCI: true
  affectedFiles: true

fileGroups:
  root_configs:
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
    - "/tsconfig.json"
    - "/pyproject.toml"
    - "/uv.lock"
  dotfiles:
    - ".*rc"
    - ".*rc.*"
    - ".*ignore"
    - ".editorconfig"
    - ".prettier*"

tasks:
  build:
    command: "true"
    args: []
    deps:
      - { target: "^:build", args: [] }

  lint:
    command: "true"
    args: []
    deps:
      - { target: "^:lint", args: [] }

  typecheck:
    command: "true"
    args: []
    deps:
      - { target: "^:typecheck", args: [] }

  format:
    command: "true"
    args: []
    deps:
      - { target: "^:format", args: [] }
    options:
      cache: false
      runInCI: false

  format-check:
    command: "true"
    args: []
    deps:
      - { target: "^:format-check", args: [] }
    options:
      cache: false
      runInCI: true
