$schema: "https://moonrepo.dev/schemas/tasks.json"

taskOptions:
  cache: true
  runInCI: true
  affectedFiles: true

fileGroups:
  root_configs:
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
    - "/tsconfig.json"
    - "/pyproject.toml"
    - "/uv.lock"
  dotfiles:
    - ".*rc"
    - ".*rc.*"
    - ".*ignore"
    - ".editorconfig"
    - ".prettier*"

tasks:
  build:
    command: "true"
    args: []
    deps:
      - target: "^:build"
    options: {}

  lint:
    command: "true"
    args: []
    deps:
      - target: "^:lint"
    options: {}

  typecheck:
    command: "true"
    args: []
    deps:
      - target: "^:typecheck"
    options: {}

  format:
    command: "true"
    args: []
    deps:
      - target: "^:format"
    options:
      cache: false
      runInCI: false

  format-check:
    command: "true"
    args: []
    deps:
      - target: "^:format-check"
    options:
      cache: false
      runInCI: true
