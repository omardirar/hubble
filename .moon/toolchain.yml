# https://moonrepo.dev/docs/config/toolchain
$schema: "./cache/schemas/toolchain.json"

# Proto version (tool version manager)
proto:
  version: "0.51.0"

# Node.js configuration
node:
  version: "20.19.0" # Match your engines requirement
  packageManager: "pnpm"
  pnpm:
    version: "10.16.1" # Match your packageManager field
  addEnginesConstraint: true
  dependencyVersionFormat: "workspace"
  inferTasksFromScripts: false # We'll define tasks explicitly
  dedupeOnLockfileChange: true

# Python configuration with UV support
python:
  version: "3.12.11" # Match your requires-python
  packageManager: "uv"
  uv:
    version: "0.9.2" # Latest stable uv version
    syncArgs: ["--all-packages"] # Install all workspace packages

# Rust (for DuckDB native dependencies)
# rust:
