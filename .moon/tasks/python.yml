$schema: "https://moonrepo.dev/schemas/tasks.json"

implicitInputs:
  - "pyproject.toml"
  - "/pyproject.toml"
  - "/uv.lock"

fileGroups:
  sources:
    - "src/**/*.py"
    - "*.py"

tasks:
  lint:
    command: "uv"
    args:
      - "run"
      - "--project"
      - "$workspaceRoot"
      - "ruff"
      - "check"
      - "."
    inputs:
      - "@group(sources)"
      - "pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - ".ruff_cache/"
    options:
      cache: false
      runInCI: true
      allowFailure: true
      runFromWorkspaceRoot: false

  lint-fix:
    command: "uv"
    args:
      - "run"
      - "--project"
      - "$workspaceRoot"
      - "ruff"
      - "check"
      - "--fix"
      - "."
    inputs:
      - "@group(sources)"
      - "pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - ".ruff_cache/"
    options:
      cache: false
      runInCI: false
      allowFailure: true
      runFromWorkspaceRoot: false

  typecheck:
    command: "uv"
    args:
      - "run"
      - "--project"
      - "$workspaceRoot"
      - "mypy"
      - "."
    inputs:
      - "@group(sources)"
      - "pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - ".mypy_cache/"
    options:
      cache: false
      runInCI: true
      allowFailure: true
      runFromWorkspaceRoot: false

  format:
    command: "uv"
    args:
      - "run"
      - "--project"
      - "$workspaceRoot"
      - "ruff"
      - "format"
      - "."
    inputs:
      - "@group(sources)"
      - "pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - ".ruff_cache/"
    options:
      cache: false
      runInCI: false
      allowFailure: true
      runFromWorkspaceRoot: false

  format-check:
    command: "uv"
    args:
      - "run"
      - "--project"
      - "$workspaceRoot"
      - "ruff"
      - "format"
      - "--check"
      - "."
    inputs:
      - "@group(sources)"
      - "pyproject.toml"
      - "/pyproject.toml"
      - "/uv.lock"
    outputs:
      - ".ruff_cache/"
    options:
      cache: false
      runInCI: true
      allowFailure: true
      runFromWorkspaceRoot: false
