name = "hubble-frontend"
main = ".open-next/worker.js"
compatibility_date = "2025-09-05"
compatibility_flags = ["nodejs_compat"]

[build]
command = "opennextjs-cloudflare build"

[observability.logs]
enabled = true

[vars]
NEXT_DISABLE_INSTRUMENTATION = "1"

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[env.preview]
# Deploys to *.workers.dev by default for preview
workers_dev = true
secrets_store_secrets = [
  { binding = "ANTHROPIC_API_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "ANTHROPIC_API_KEY" },
  { binding = "CLERK_SECRET_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "CLERK_SECRET_KEY" },
  { binding = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" },
  { binding = "SUPABASE_ANON_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "SUPABASE_ANON_KEY" },
  { binding = "SUPABASE_URL", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "SUPABASE_URL" }
]

[env.production]
# Safe default to deploy to *.workers.dev until a custom route is configured
workers_dev = true
secrets_store_secrets = [
  { binding = "ANTHROPIC_API_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "ANTHROPIC_API_KEY" },
  { binding = "CLERK_SECRET_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "CLERK_SECRET_KEY" },
  { binding = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" },
  { binding = "SUPABASE_ANON_KEY", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "SUPABASE_ANON_KEY" },
  { binding = "SUPABASE_URL", store_id = "f37d78acf99641778b64ea4c0761c543", secret_name = "SUPABASE_URL" }
]
# To use a custom domain, comment the line above and set routes like:
# routes = ["your-domain.com/*"]

# Bindings: add only when referenced by the app.

# [[kv_namespaces]]
# binding = "MY_KV"
# id = "<kv_namespace_id>"

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# [[d1_databases]]
# binding = "DB"
# database_name = "my-db"
# database_id = "<d1_db_id>"

# [[durable_objects.bindings]]
# name = "MY_DO"
# class_name = "MyDurableObject"
