[project]
name = "mcp-server-motherduck"
version = "0.6.3"
description = "An always-on MCP server for MotherDuck"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb==1.3.1",
  "tabulate>=0.9.0",
  "click>=8.1.8",
  "starlette>=0.46.1",
  "uvicorn>=0.34.0",
  "anyio>=4.8.0",
  "mcp>=1.9.4",
  "pytz>=2025.2",
  "sqlparse>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motherduck"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "ruff>=0.9.1",
]

[project.scripts]
mcp-server-motherduck = "motherduck.server:main"

[tool.ruff]
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
