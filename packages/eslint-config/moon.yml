$schema: "https://moonrepo.dev/schemas/project.json"

id: "eslint-config"
language: "typescript"
layer: "configuration"
stack: "infrastructure"
tags:
  - "shared"
  - "config"

workspace:
  inheritedTasks:
    exclude: ["lint", "typecheck", "format", "format-check", "build"]

fileGroups:
  sources:
    - "*.mjs"
    - "*.d.ts"
    - "*.json"
