$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "configuration"
stack: "infrastructure"
tags:
  - "shared"
  - "config"

workspace:
  inheritedTasks:
    exclude: ["lint", "typecheck", "format", "format-check"]

fileGroups:
  sources:
    - "*.json"

tasks:
  build:
    command: "echo"
    args:
      - "No build needed for tsconfig package"
    options:
      cache: true
      runInCI: true
      mergeArgs: "replace"
      mergeDeps: "replace"
      mergeOutputs: "replace"
