name: Manage Cloudflare Secrets

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to update secrets for"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
      action:
        description: "Action to perform"
        required: true
        default: "list"
        type: choice
        options:
          - list
          - update

permissions:
  contents: read

jobs:
  manage-secrets:
    name: Manage Secrets for ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: List Secrets
        if: inputs.action == 'list'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "apps/web"
          command: secret list --env ${{ inputs.environment }}

      - name: Update Clerk Secret Key
        if: inputs.action == 'update'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "apps/web"
          command: secret put CLERK_SECRET_KEY --env ${{ inputs.environment }}
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
