name: CI

on:
  push:

jobs:
  ci:
    name: "CI"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v5"
        with:
          fetch-depth: 0

      - name: "Setup Toolchain"
        uses: "moonrepo/setup-toolchain@v0"
        with:
          auto-install: true

      - name: "Execute pipeline"
        run: "moon ci"
        env:
          CI: "true"

      - name: "Collect/retrospect on results"
        uses: "appthrust/moon-ci-retrospect@v2"
        if: success() || failure()
