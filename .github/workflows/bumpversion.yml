name: Release on version change

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release_from_bump_commit:
    if: ${{ contains(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    name: "Release from bump commit: changelog + tag + GH release"
    concurrency:
      group: bumpversion-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Commitizen
        run: |
          python -m pip install --upgrade pip
          pip install commitizen cz-conventional-gitmoji
      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Detect version change from package.json
        id: version
        run: |
          CURRENT=$(jq -r .version package.json)
          echo "current_version=$CURRENT" >> $GITHUB_OUTPUT
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" = "$CURRENT" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Update changelog
        if: steps.version.outputs.changed == 'true'
        run: |
          cz -n cz_gitmoji changelog --unreleased --incremental
          git add CHANGELOG.md
          git commit -m "📝 docs: update changelog for ${{ steps.version.outputs.current_version }}" || true
          git push
      - name: Tag and push
        if: steps.version.outputs.changed == 'true'
        run: |
          git tag ${{ steps.version.outputs.current_version }}
          git push origin ${{ steps.version.outputs.current_version }}
      - name: Release
        if: steps.version.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.current_version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
