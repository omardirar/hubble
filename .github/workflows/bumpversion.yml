name: Bump version

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    name: "Bump version and create changelog with commitizen"
    concurrency:
      group: bumpversion-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Commitizen
        run: |
          python -m pip install --upgrade pip
          pip install commitizen cz-conventional-gitmoji
      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check if there are commits to bump
        id: check-commits
        run: |
          # Get the last tag, or fallback to HEAD~10 if no tags exist
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~10")
          echo "Checking commits since: $LAST_TAG"

          # Check if there are commits since the last tag that can be bumped
          if cz check --rev-range $LAST_TAG..HEAD; then
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "Found commits eligible for version bump"

            # Show what commits will be included
            echo "Commits to be included in bump:"
            git log --oneline $LAST_TAG..HEAD
          else
            echo "has_commits=false" >> $GITHUB_OUTPUT
            echo "No commits found that are eligible for version bump"
            echo "Make sure commits follow conventional commit format (feat:, fix:, etc.)"
          fi
      - name: Generate bump and changelog
        if: steps.check-commits.outputs.has_commits == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cz bump --yes --changelog
          echo "REVISION=$(cz version --project)" >> $GITHUB_ENV

          # Verify the tag was created
          echo "Created tag: $REVISION"
          git tag --list | grep "$REVISION" || echo "Warning: Tag $REVISION not found locally"

          # Push the tag
          git push --follow-tags

          # Verify tag was pushed to remote
          echo "Verifying tag was pushed to remote..."
          git ls-remote --tags origin | grep "$REVISION" || echo "Warning: Tag $REVISION not found on remote"
      - name: Release
        if: steps.check-commits.outputs.has_commits == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REVISION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
