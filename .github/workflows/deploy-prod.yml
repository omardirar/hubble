---
name: Deploy production (disabled)

# Temporarily disabled: manual-only while apps/api deployment is being implemented
# To re-enable automatic deployments, restore the push trigger below and remove workflow_dispatch-only mode.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for manual run (temporary disablement)"
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace via Turbo
        run: pnpm build

      - name: OpenNext build (generates .open-next)
        working-directory: apps/web
        run: pnpm dlx opennextjs-cloudflare build --yes

      - name: Set up Wrangler
        working-directory: apps/web
        run: pnpm exec wrangler --version || (pnpm add -D wrangler && pnpm exec wrangler --version)

      # Secrets are managed via Dashboard; no secret writes in CI

      - name: Deploy to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: |
          pnpm exec wrangler deploy --env production \
            --var GIT_COMMIT=${{ github.sha }} \
            --var GIT_BRANCH=${{ github.ref_name }}
