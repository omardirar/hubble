name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_DISABLE_INSTRUMENTATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build Next
        run: npm run build

      - name: OpenNext build (generates .open-next)
        run: npx opennextjs-cloudflare build --yes

      - name: Set up Wrangler
        run: npm run --silent wrangler -- --version || npm i -D wrangler && npx wrangler --version

      - name: Deploy to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env production \
            --var GIT_COMMIT=${{ github.sha }} \
            --var GIT_BRANCH=${{ github.ref_name }}
