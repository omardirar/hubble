---
name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build Next
        run: npm run build

      - name: OpenNext build (generates .open-next)
        run: npx opennextjs-cloudflare build --yes

      - name: Set up Wrangler
        run: npm run --silent wrangler -- --version || npm i -D wrangler && npx wrangler --version

      - name: Set Worker secrets (production)
        if: env.CLOUDFLARE_API_TOKEN && env.CLOUDFLARE_ACCOUNT_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf "%s" "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" | \
            npx wrangler secret put NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY --env production --yes
          printf "%s" "${CLERK_SECRET_KEY}" | \
            npx wrangler secret put CLERK_SECRET_KEY --env production --yes
          printf "%s" "${ANTHROPIC_API_KEY}" | \
            npx wrangler secret put ANTHROPIC_API_KEY --env production --yes
          printf "%s" "${SUPABASE_URL}" | \
            npx wrangler secret put SUPABASE_URL --env production --yes
          printf "%s" "${SUPABASE_ANON_KEY}" | \
            npx wrangler secret put SUPABASE_ANON_KEY --env production --yes

      - name: Deploy to Cloudflare (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env production \
            --var GIT_COMMIT=${{ github.sha }} \
            --var GIT_BRANCH=${{ github.ref_name }}
