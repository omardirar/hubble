---
# GitHub Actions Workflow: Deploy Preview
#
# This workflow automatically deploys the Hubble application to the preview environment
# when pull requests are opened against the main branch. It also supports manual
# triggering for testing and debugging purposes.
#
# Architecture:
# - Deploys both API worker and web app to preview environment
# - Uses Cloudflare Wrangler for deployment
# - Leverages Turbo cache for faster builds
# - Deploys to *.workers.dev subdomains
#
# Triggers:
# - Pull requests to main branch (automatic)
# - Manual workflow dispatch (for testing)

name: Deploy Preview

# Workflow triggers
on:
  pull_request:
    branches: ["main"] # Trigger on PRs to main branch
  workflow_dispatch: # Allow manual triggering
    inputs:
      reason:
        description: "Optional note for manual run"
        required: false

# Required permissions
permissions:
  contents: read # Read repository contents

# Job definitions
jobs:
  # Deploy API Worker to preview environment
  deploy-api:
    name: Deploy API Worker (Preview)
    runs-on: ubuntu-latest
    env:
      # Turbo cache configuration for faster builds
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }} # Turbo authentication token
      TURBO_TEAM: ${{ vars.TURBO_TEAM }} # Turbo team identifier
      TURBO_CACHE: remote:rw # Enable remote cache read/write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Deploy API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "apps/api"
          command: deploy --env preview
          wranglerVersion: "4.35.0"
          packageManager: "pnpm"

  deploy-web:
    name: Deploy Web App (Preview)
    runs-on: ubuntu-latest
    needs: deploy-api
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_CACHE: remote:rw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Deploy Web App
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "apps/web"
          command: deploy --env preview
          wranglerVersion: "4.35.0"
          packageManager: "pnpm"
