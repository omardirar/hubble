name: Deploy preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build Next
        run: npm run build

      - name: OpenNext build (generates .open-next)
        run: npx opennextjs-cloudflare build --yes

      - name: Set up Wrangler
        run: npm run --silent wrangler -- --version || npm i -D wrangler && npx wrangler --version

      - name: Prepare branch env
        run: |
          echo "BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" >> $GITHUB_ENV
      - name: Deploy to Cloudflare (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env preview \
            --var GIT_COMMIT=${{ github.sha }} \
            --var GIT_BRANCH=${BRANCH_NAME}
